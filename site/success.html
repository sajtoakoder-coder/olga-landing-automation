<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Оплата прошла — Ольга Андреева</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#0a0908;--paper:#f2ede4;--paper-2:#e8e1d4;--dust:#8a7d70;--dust-2:#5a4f47;--blood:#c94a3a;--blood-deep:#9c3324;--serif:'Bodoni Moda',serif;--serif-italic:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.brand{font-family:var(--serif);letter-spacing:.32em;text-transform:uppercase;font-size:15px;margin-bottom:34px;color:var(--paper)}
.brand em{font-style:italic;color:var(--blood);letter-spacing:.14em}
.card{background:var(--paper);color:var(--ink);max-width:480px;width:100%;padding:52px 40px;position:relative;text-align:left}
.card::before{content:'GRATIAS · SOLUTUM';position:absolute;top:12px;right:16px;font-size:9px;letter-spacing:.4em;color:var(--dust-2)}
.rule{width:60px;height:1px;background:var(--blood-deep);margin:0 0 26px}
h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.05;margin-bottom:16px}
h1 em{font-style:italic;color:var(--blood-deep)}
.sub{font-family:var(--serif-italic);font-style:italic;font-size:19px;line-height:1.5;color:var(--dust-2)}
.details{margin-top:26px;padding-top:20px;border-top:1px dotted rgba(20,16,16,.3);font-size:14px;line-height:1.7;color:var(--dust-2)}
.details b{color:var(--ink);font-weight:500}
.link-btn{display:none;margin-top:26px;padding:18px 24px;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:11px;letter-spacing:.35em;text-transform:uppercase;text-decoration:none;text-align:center;transition:background .3s}
.link-btn:hover{background:var(--blood-deep)}
.link-btn.show{display:block}
.back{margin-top:26px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dust)}
.back a{color:inherit;text-decoration:none;border-bottom:1px solid var(--dust-2);padding-bottom:2px}
.back a:hover{color:var(--paper)}
.sign{margin-top:28px;font-family:var(--serif-italic);font-style:italic;font-size:17px;color:var(--dust-2)}
@media(max-width:480px){.card{padding:40px 24px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="brand">Olga <em>Andreeva</em></div>
<div class="card">
  <div class="rule" aria-hidden="true"></div>
  <h1 id="title">Оплата <em>прошла</em> успешно.</h1>
  <p class="sub" id="message">Спасибо! Я получила вашу оплату и уже знаю о ней.</p>
  <div class="details" id="details" hidden>
    <div id="d-product"></div>
    <div id="d-slot"></div>
  </div>
  <a class="link-btn" id="link" rel="noopener" target="_blank">Открыть ссылку →</a>
  <div class="sign">— Ольга А.</div>
</div>
<div class="back"><a href="/">← вернуться на сайт</a></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var paymentId = params.get('payment_id') || params.get('id') || (params.get('label') || '');
  if(!paymentId || !window.fetch) return;
  fetch('/api/payment/status?id=' + encodeURIComponent(paymentId))
    .then(function(r){ if(!r.ok) throw new Error('status ' + r.status); return r.json(); })
    .then(function(data){
      if(!data.ok || !data.payment) return;
      var p = data.payment;
      if(p.status !== 'paid'){
        document.getElementById('title').innerHTML = 'Платёж <em>обрабатывается</em>…';
      }
      if(p.message){ document.getElementById('message').textContent = p.message; }
      var details = document.getElementById('details');
      if(p.product_title){
        var product = document.getElementById('d-product');
        product.textContent = '';
        var b = document.createElement('b');
        b.textContent = p.product_title;
        product.appendChild(b);
        if(p.amount){ product.appendChild(document.createTextNode(' — ' + p.amount.toLocaleString('ru-RU') + ' ₽')); }
        details.hidden = false;
      }
      if(p.slot_label){
        document.getElementById('d-slot').textContent = 'Время сессии: ' + p.slot_label;
        details.hidden = false;
      }
      if(p.link && /^https?:\/\//i.test(p.link)){
        var link = document.getElementById('link');
        link.href = p.link;
        link.classList.add('show');
      }
    })
    .catch(function(){ /* оставляем общий текст */ });
})();
</script>
</body>
</html>
